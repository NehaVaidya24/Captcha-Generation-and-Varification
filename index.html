<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captcha Generation and Verification</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <div class="container">
    <h2>CAPTCHA GENERATOR</h2>

    <div class="row">
      <div class="input" id="AutoGeneratedValue"></div>
        <i class="fa-solid fa-arrows-rotate" onclick="generateAutoCaptcha()"></i>
    </div>
    <div class="row">
      <input type="text" name="CAPTCHA" id="userCaptchaValue">
      <i class="fa-solid fa-xmark" id="checkIcon"></i>
    </div>

    <button id="Btn" onclick="DoValidateCaptchas()">Submit Captcha</button>
    <h5 id="message"></h5>
  </div>

  <script src="script.js"></script>
</body>
</html>
